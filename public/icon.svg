<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="lpTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00d2ff"/>
      <stop offset="50%" stopColor="#00f5a0"/>
      <stop offset="100%" stopColor="#05d550"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0c162c"/>
      <stop offset="100%" stopColor="#060c18"/>
    </linearGradient>
  </defs>

  <!-- Bright, luminous brand tile (100% visible on dark & light browser tabs) -->
  <rect width="32" height="32" rx="7.5" fill="url(#lpTile)"/>

  <!-- Center Shield Badge for brand framing -->
  <path d="M16 4.2L7.2 7.8V15.2C7.2 21.6 11 25.6 16 27.5C21 25.6 24.8 21.6 24.8 15.2V7.8L16 4.2Z" 
        fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Parking 'P' in Pure Bright White (Bold & Sharp) -->
  <path d="M12.2 10.2V20.8M12.2 10.2H16.8C18.8 10.2 20.2 11.4 20.2 13.1C20.2 14.8 18.8 16 16.8 16H12.2" 
        stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Verified Checkmark in Electric Cyan (Vivid & Clear) -->
  <path d="M15.2 17.5L18 20.3L23.2 13.8" 
        stroke="#00ffcc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
