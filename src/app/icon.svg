<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00ffcc"/>
      <stop offset="50%" stopColor="#00c8ff"/>
      <stop offset="100%" stopColor="#39ff14"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" stroke="#00ffcc" stroke-width="1.2" stroke-opacity="0.5"/>
  
  <!-- Shield Outline -->
  <path d="M16 4.5L6.5 8.5V16C6.5 22.5 10.8 26.8 16 28.5C21.2 26.8 25.5 22.5 25.5 16V8.5L16 4.5Z" 
        fill="#00ffcc" fill-opacity="0.18" stroke="url(#shieldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
        
  <!-- Parking 'P' Letter -->
  <path d="M12 11V22M12 11H17.2C19.2 11 20.8 12.4 20.8 14.2C20.8 16 19.2 17.4 17.2 17.4H12" 
        stroke="url(#shieldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Verified Checkmark -->
  <path d="M15.5 18.5L18.5 21.5L24 14.5" 
        stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
